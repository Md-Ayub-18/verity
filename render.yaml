databases:
  - name: verity-db
    plan: free
    databaseName: verity_db
    user: verity

services:
  - type: web
    name: verity-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FFMPEG_PATH
        value: ffmpeg

  - type: web
    name: verity-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: verity-backend
          property: host

